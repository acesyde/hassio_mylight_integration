[project]
name = "mylight_systems"
version = "0.1.0"
description = "MyLight Systems integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.13.2,<4.0"
license = "MIT"
authors = [{ name = "Pierre-Emmanuel Mercier", email = "acesyde@gmail.com" }]
keywords = ["energy", "hassio", "homeassistant", "mylight", "power", "solar"]
dependencies = [
  "aiohttp >= 3.8",
  "async-timeout >= 5.0",
  "homeassistant >= 2025.7.0",
  "yarl >= 1.9",
]
repository = "https://github.com/acesyde/hassio_mylight_integration"

[dependency-groups]
dev = [
  "aioresponses>=0.7.8",
  "aresponses >= 3.0.0",
  "pytest-cov >= 7.1.0",
  "pytest-socket >= 0.6",
  "pytest >= 9.0.2",
  "ruff >= 0.4",
  "ty>=0.0.25",
]

[tool.coverage.run]
source = ["src"]
omit = ["**/tests/**", "**/__init__.py", "**/__main__.py"]

[tool.pytest.ini_options]
addopts = "-rxf -x -v -l --cov=./ --cov-report=xml"
pythonpath = ["custom_components/mylight_systems"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
indent-width = 4
exclude = [
  ".venv",
  ".codeclimate.yml",
  ".codecov.yml",
  ".coveragerc",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".pre-commit-config.yaml",
  "venv",
  "mise.toml",
  "mise.lock",
]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "C90",  # mccabe
  "N",  # pep8-naming
  "G",  # flake8-logging-format
  "S",  # flake8-bandit
  "ASYNC",  # flake8-async,
  "PL",  # pylint
]
ignore = [
  "G004",  # logging-fstring-interpolation
  "E501",  # line-too-long
  "RET505",  # no-else-return
  "RET507",  # no-else-continue
  "UP032",  # f-string
  "BLE001",  # broad-exception-caught
  "PLR2004",  # magic-value-comparison
  "S101",  # assert
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 10
max-positional-args = 10
max-returns = 10
